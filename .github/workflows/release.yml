name: Build Release ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create installable addon ZIP
        run: |
          mkdir -p build/WowNote

          cp WowNote.toc build/WowNote/
          cp *.lua build/WowNote/

          echo "Files included in addon folder:"
          ls -la build/WowNote

          cd build
          zip -r "WowNote-${GITHUB_REF_NAME}.zip" WowNote

          echo "ZIP contents:"
          unzip -l "WowNote-${GITHUB_REF_NAME}.zip"

      - name: Create or update GitHub Release
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Release ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to GitHub Release
        run: |
          gh release upload "${GITHUB_REF_NAME}" "build/WowNote-${GITHUB_REF_NAME}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
