name: Build Release ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create installable addon ZIP
        run: |
          mkdir -p build/WowNote

          cp WowNote.toc build/WowNote/
          cp *.lua build/WowNote/

          cd build
          zip -r "WowNote-${GITHUB_REF_NAME}.zip" WowNote

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v3
        with:
          files: build/WowNote-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
